        <section class="contact">
            <h1 class="retro" id="title4">Contact Me!</h1>
            <div class= "contactBox">
                <h2 class = "jim-nightshade-regular">Get in Touch!</h2>
                <form action="https://formspree.io/f/mbdwwrgk" method="POST">

                    <div class="input">
                        <div class ="inputGroup">
                            <label class = "jim-nightshade-regular">Name:</label>
                            <input type="text" name="name" placeholder="Victor Wembanyama" class="jim-nightshade-regular">
                        </div>
                        <div class ="inputGroup">
                            <label class = "jim-nightshade-regular">Email:</label>
                            <input type="text" name="email" placeholder="yourEmail@email.com" class="jim-nightshade-regular">
                        </div>
                        <div class ="inputGroup">
                            <label class = "jim-nightshade-regular">Subject:</label>
                            <input type="text" name="subject" placeholder="Job Offer" class="jim-nightshade-regular">
                        </div>
                    </div>

                    <label class = "jim-nightshade-regular">Enter Message: </label>
                    <textarea rows="5" name="message" placeholder="Dear Joshua, ..." class="jim-nightshade-regular"></textarea>

                    <button type="submit" class="submitBtn">SEND MESSAGE!</button>
                </form>

                <div class="contactLinks">
                    <a href="mailto:ozomaroj@gmail.com" class = "jim-nightshade-regular">Email</a>
                    <a href="https://www.linkedin.com/in/joshua-ozomaro-961312251/" class = "jim-nightshade-regular">LinkedIn</a>
                    <a href="https://github.com/jaozomar" class = "jim-nightshade-regular">Github</a>
                </div>

            </div>
        </section>
